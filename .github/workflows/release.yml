name: Release

# Push a tag like v0.1.0 (matching `version` in gradle.properties) to build and attach the jars to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v${version%%+*}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=$(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar | grep -v -e '-sources.jar' -e '-javadoc.jar')
          gh release create "$GITHUB_REF_NAME" $jars --title "$GITHUB_REF_NAME" --generate-notes
